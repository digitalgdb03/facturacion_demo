<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ferremateriales Ruiz 2020 — Facturación e Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --navy-900:#0b1d33; --navy-800:#102742; --navy-700:#16304f; --navy-600:#1e3a5f;
  --navy-50:#eef3f8; --navy-100:#dbe6f1;
  --accent:#00b7c3; --accent-600:#00929c; --accent-400:#4dd6e0;
  --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0; --slate-300:#cbd5e1;
  --slate-400:#94a3b8; --slate-500:#64748b; --slate-600:#475569; --slate-700:#334155; --slate-800:#1e293b;
  --red:#dc2626; --red-bg:#fee2e2; --green:#059669; --green-bg:#d1fae5; --info-bg:#e0f7fa; --info-tx:#00838f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--slate-100);color:var(--slate-800);font-size:14px;line-height:1.5}
.tnum{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--slate-300);border-radius:8px}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Inputs / buttons */
.input,.field select,.field input{width:100%;border:1px solid var(--slate-300);border-radius:8px;padding:9px 11px;font-size:14px;color:var(--slate-800);background:#fff}
.input:focus,.field input:focus,.field select:focus{outline:none;border-color:var(--navy-600);box-shadow:0 0 0 3px rgba(30,58,95,.15)}
.field{display:block}
.field>span{display:block;font-size:12px;font-weight:600;color:var(--slate-500);margin-bottom:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;transition:background .15s,opacity .15s;text-decoration:none}
.btn-primary{background:var(--navy-700);color:#fff}.btn-primary:hover{background:var(--navy-800)}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{background:var(--accent-600)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-ghost{color:var(--slate-600)}.btn-ghost:hover{background:var(--slate-100)}
.link{color:var(--navy-700);font-size:12px;font-weight:600}.link:hover{text-decoration:underline}
.link-red{color:var(--red);font-size:12px;font-weight:600}.link-red:hover{text-decoration:underline}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;color:var(--slate-500);background:var(--slate-100);font-size:16px;transition:background .15s,color .15s,opacity .15s;vertical-align:middle;text-decoration:none;border:none}
.iconbtn:hover{opacity:.75}
.iconbtn.edit{background:var(--navy-100);color:var(--navy-700)}
.iconbtn.view{background:var(--info-bg);color:var(--info-tx)}
.iconbtn.danger{background:var(--red-bg);color:var(--red)}
.iconbtn svg{width:19px;height:19px}
.cat-action{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;color:var(--slate-400);cursor:pointer}
.cat-action svg{width:12px;height:12px}
.cat-action:hover{background:var(--slate-100);color:var(--navy-700)}
.cat-action.danger:hover{background:var(--red-bg);color:var(--red)}
.btn .ic,.btn .ic svg{display:inline-flex;width:18px;height:18px}

/* Cards & tables */
.card{background:#fff;border:1px solid var(--slate-200);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card-h{padding:14px 20px;border-bottom:1px solid var(--slate-100);display:flex;align-items:center;justify-content:space-between}
.card-h h3{font-size:15px;font-weight:700;color:var(--slate-800)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
thead{background:var(--slate-50)}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--slate-500);padding:11px 16px}
td{padding:11px 16px;border-top:1px solid var(--slate-100)}
tbody tr:hover{background:rgba(248,250,252,.7)}
.muted{color:var(--slate-400)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}

/* Badge */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.badge.slate{background:var(--slate-100);color:var(--slate-600)}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.info{background:var(--info-bg);color:var(--info-tx)}
.badge.navy{background:var(--navy-100);color:var(--navy-700)}
.badge.purple{background:#ede9fe;color:#6d28d9}
.badge.amber{background:#fef3c7;color:#92400e}

/* Money */
.money{text-align:right}
.money .u{font-size:14px;font-weight:600;color:var(--slate-800)}
.money .b{font-size:12px;color:var(--slate-400)}

/* Layout */
.layout{display:flex;min-height:100vh}
.sidebar{width:256px;background:var(--navy-900);color:#cbd9ea;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;transition:transform .2s}
.brand{padding:18px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.1)}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg, var(--accent-400) 0%, var(--accent) 55%, var(--accent-600) 100%);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 14px rgba(0,183,195,.45)}
.logo svg{width:21px;height:21px}
.brand-text{min-width:0}
.brand .t1{color:#fff;font-weight:800;line-height:1.3;font-size:14px;white-space:normal;word-break:break-word}
.brand .t2{font-size:11px;color:rgba(203,217,234,.6)}
.nav{flex:1;padding:14px 12px;overflow-y:auto}
.nav button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:500;color:rgba(203,217,234,.75);text-align:left;margin-bottom:3px}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.active{background:rgba(0,183,195,.12);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav .ico{width:20px;height:20px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.nav .ico svg{width:19px;height:19px}
.sidebar .foot .ico{width:20px;height:20px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.sidebar .foot .ico svg{width:19px;height:19px}
.sidebar .foot{padding:12px;border-top:1px solid rgba(255,255,255,.1)}
.sidebar .foot button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:rgba(203,217,234,.75);font-size:14px}
.sidebar .foot button:hover{background:rgba(255,255,255,.06);color:#fff}
.main{flex:1;margin-left:256px;display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--slate-200);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:20}
.topbar h1{font-family:'Bebas Neue',system-ui,sans-serif;font-size:30px;font-weight:400;color:var(--navy-900);line-height:1;letter-spacing:1px;text-transform:uppercase}
.page-sub{font-size:13px;font-weight:500;color:var(--slate-400);margin-top:2px}
.rate{position:relative;display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:148px;border-radius:10px;padding:7px 14px;background:#0e2340 url('static/images/bdv.png') center/cover;box-shadow:0 6px 16px -4px rgba(11,29,51,.5)}
.rate-row{display:flex;align-items:center;gap:6px}
.rate-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(5,150,105,.3)}
.rate-lbl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:rgba(203,217,234,.8)}
.rate-val{font-size:19px;font-weight:800;color:var(--accent-400);line-height:1}
.rate-sub{font-size:11px;font-weight:600;color:rgba(203,217,234,.6);margin-left:6px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--navy-700);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none;border:none;cursor:pointer}
.user-menu{position:relative}
.user-menu-dropdown{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:60;background:#fff;border:1px solid var(--slate-200);border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,.12);min-width:200px;padding:8px;overflow:hidden}
.user-menu.open .user-menu-dropdown{display:block}
.user-menu-name{padding:8px 10px;font-size:12px;font-weight:700;color:var(--slate-400);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--slate-100);margin-bottom:4px}
.user-menu-dropdown a,.user-menu-dropdown button{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:14px;color:var(--slate-700);text-decoration:none;background:none;border:none;cursor:pointer}
.user-menu-dropdown a:hover,.user-menu-dropdown button:hover{background:var(--slate-100)}
.content{flex:1;padding:32px;overflow-x:hidden}
.hamb{display:none;align-items:center;justify-content:center;width:36px;height:36px;flex-shrink:0;color:var(--slate-500)}
.hamb svg{width:24px;height:24px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30}

/* Grid helpers */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:2fr 1fr}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px}
.between{justify-content:space-between;align-items:center}

/* Stat card */
.stat{background:#fff;border:1px solid var(--slate-200);border-left:4px solid var(--navy-700);border-radius:12px;padding:18px}
.stat.green{border-left-color:var(--green)}.stat.red{border-left-color:var(--red)}.stat.info{border-left-color:var(--accent)}
.stat .l{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--slate-400)}
.stat .v{font-size:26px;font-weight:800;color:var(--slate-800);margin-top:4px}
.stat .s{font-size:12px;color:var(--slate-400);margin-top:2px}

/* Tasa BCV card (dashboard) */
.tasa-bcv-card{background:var(--navy-900);border-radius:12px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}
.tasa-bcv-card::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:90%;padding-top:90%;background:url('static/images/logoBCV.png') no-repeat center/contain;opacity:.1}
.tasa-bcv-card>*{position:relative}
.tasa-bcv-card h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:rgba(203,217,234,.65)}
.tasa-bcv-card .val{font-size:38px;font-weight:800;color:#fff;margin-top:10px}
.tasa-bcv-card .val small{font-size:15px;font-weight:600;color:var(--accent-400)}
.tasa-bcv-card .sub{font-size:12px;color:rgba(203,217,234,.5);margin-top:8px}
.bar-row{margin-bottom:12px}
.bar-row .bar-lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--slate-700)}
.bar-track{background:var(--slate-100);border-radius:6px;height:8px;margin-top:5px;overflow:hidden}
.bar-fill{height:8px;border-radius:6px}

/* Login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg, var(--navy-900) 0%, var(--navy-700) 50%, var(--accent) 100%);padding:16px}
.login-box{width:100%;max-width:400px}
.login-head{text-align:center;margin-bottom:28px}
.login-head .logo{width:64px;height:64px;border-radius:18px;margin:0 auto;box-shadow:0 10px 25px rgba(0,0,0,.35)}
.login-head .logo svg{width:32px;height:32px}
.login-head h1{color:#fff;font-size:24px;font-weight:800;margin-top:14px}
.login-head p{color:rgba(203,217,234,.6);font-size:13px}
.login-card{background:#fff;border-radius:16px;box-shadow:0 20px 40px rgba(0,0,0,.25);padding:28px}
.login-card h2{font-weight:700;color:var(--slate-800)}
.login-card .hint{font-size:12px;color:var(--slate-400);margin:2px 0 18px}
.login-demo-users{font-size:12px;color:rgba(203,217,234,.65);text-align:center;margin-top:18px;line-height:1.6}
.login-demo-users b{color:rgba(255,255,255,.85)}
.err{font-size:12px;color:var(--red);background:var(--red-bg);border-radius:8px;padding:8px 12px;margin-top:4px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;box-shadow:0 25px 50px rgba(0,0,0,.3);width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--slate-100);position:sticky;top:0;background:#fff}
.modal-h h3{font-weight:700;color:var(--slate-800)}
.modal-x{font-size:22px;color:var(--slate-400);line-height:1}
.modal-b{padding:24px}
.modal-foot{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}

/* Tarjeta de contacto (Digital Gdb) */
.vendor-contact-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-radius:8px;color:var(--slate-700);text-decoration:none;font-weight:600;font-size:14px}
.vendor-contact-row:hover{background:var(--slate-50);color:var(--navy-700)}
.vendor-contact-ico{width:36px;height:36px;border-radius:8px;background:var(--info-bg);color:var(--info-tx);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vendor-contact-ico svg{width:18px;height:18px}

/* Facturación */
.results{position:absolute;left:16px;right:16px;margin-top:4px;background:#fff;border:1px solid var(--slate-200);border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,.12);z-index:10;max-height:300px;overflow-y:auto}
.results button{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;text-align:left;border-bottom:1px solid var(--slate-50)}
.results button:hover{background:var(--slate-50)}
.results button:disabled{opacity:.4;cursor:not-allowed}
.summary{background:var(--navy-900);color:#fff;border-radius:12px;padding:20px}
.summary .line{display:flex;justify-content:space-between;font-size:14px;color:rgba(203,217,234,.85);margin-bottom:10px}
.summary .acc{color:var(--accent-400)}
.summary .tot{border-top:1px solid rgba(255,255,255,.12);padding-top:12px}
.summary .tot .big{font-size:26px;font-weight:800}
.qty{width:60px;text-align:center;border:1px solid var(--slate-300);border-radius:6px;padding:5px}

.empty{padding:40px 16px;text-align:center;color:var(--slate-400);font-size:14px}
.flash{background:var(--green-bg);border:1px solid #a7f3d0;color:var(--green);font-size:14px;font-weight:600;border-radius:8px;padding:12px 16px}
.flash.error{background:var(--red-bg);border-color:#fecaca;color:var(--red)}
.flash.info{background:var(--info-bg);border-color:#bfdbfe;color:var(--info-tx)}

/* Toasts */
.toast-wrap{position:fixed;top:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:10px;max-width:340px}
.toast{background:#fff;border-left:4px solid var(--green);border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,.15);padding:12px 16px;font-size:13px;font-weight:600;color:var(--slate-700);animation:toastIn .2s ease;display:flex;align-items:center;gap:10px}
.toast.error{border-left-color:var(--red);color:var(--red)}
.toast.info{border-left-color:var(--navy-600);color:var(--navy-700)}
@keyframes toastIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

/* Confirm modal */
.confirm-modal{background:#fff;border-radius:16px;box-shadow:0 25px 50px rgba(0,0,0,.3);width:100%;max-width:400px;padding:24px}
.confirm-modal h3{font-size:16px;font-weight:700;color:var(--slate-800);margin-bottom:6px}
.confirm-modal p{font-size:13px;color:var(--slate-500);line-height:1.5}
.confirm-modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}

/* Clearable search input */
.search-wrap{position:relative}
.search-wrap input{padding-right:32px}
.search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--slate-400);font-size:15px;line-height:1}
.search-clear:hover{background:var(--slate-100);color:var(--slate-700)}

/* Field error */
.field-err{font-size:11px;color:var(--red);margin-top:4px}
.input-err{border-color:var(--red)!important;box-shadow:0 0 0 3px rgba(220,38,38,.12)!important}
.section-title{font-size:15px;font-weight:700;color:var(--slate-800)}
.section-sub{font-size:12px;color:var(--slate-400);margin:2px 0 16px}
.maxw{max-width:900px}

@media(max-width:1024px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .hamb{display:flex}
  .topbar{padding:12px 16px}
  .content{padding:16px}
  .g4{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr}
  .overlay.show{display:block}
}

/* Escritorio (>=1025px): riel fijo de solo iconos; al pasar el mouse se
   expande y muestra las etiquetas. No depende del botón hamburguesa. */
@media(min-width:1025px){
  .sidebar{
    transform:none !important;
    width:76px;
    overflow-x:hidden;
    transition:width .18s ease, box-shadow .18s ease;
  }
  .main{margin-left:76px !important}
  .sidebar .brand{justify-content:center;padding-left:0;padding-right:0}
  .sidebar .brand-text,
  .sidebar .nav button .lbl,
  .sidebar .foot button .lbl{display:none}
  .sidebar .nav button{justify-content:center;padding-left:0;padding-right:0}
  .sidebar .foot button{justify-content:center;padding-left:0;padding-right:0}

  .sidebar:hover{
    width:250px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.45);
    z-index:50;
  }
  .sidebar:hover .brand{justify-content:flex-start;padding-left:20px;padding-right:20px}
  .sidebar:hover .brand-text{display:block}
  .sidebar:hover .nav button .lbl,
  .sidebar:hover .foot button .lbl{display:inline}
  .sidebar:hover .nav button{justify-content:flex-start;padding-left:12px;padding-right:12px}
  .sidebar:hover .foot button{justify-content:flex-start;padding-left:12px;padding-right:12px}

  .hamb{display:none !important}
  .overlay{display:none !important}
}
@media(max-width:640px){
  .g4,.g2{grid-template-columns:1fr}
  .rate{display:none}
  .hide-sm{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="confirm-root"></div>
<div class="toast-wrap" id="toast-root"></div>

<script>
/* ================================================================ */
/*  Helpers                                                          */
/* ================================================================ */
const fmtUSD = n => '$' + (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtBs  = n => 'Bs ' + (Number(n)||0).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
const todayStr = () => new Date().toLocaleDateString('es-VE',{day:'2-digit',month:'2-digit',year:'numeric'});
const fmtDateObj = d => d.toLocaleDateString('es-VE',{day:'2-digit',month:'2-digit',year:'numeric'});
const toISODate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const initials = nombre => (nombre||'').trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'?';
const clearableInput = (id,placeholder,value,maxWidth) => `<div class="search-wrap" style="${maxWidth?`max-width:${maxWidth}px`:''}"><input class="input" id="${id}" placeholder="${esc(placeholder)}" value="${esc(value)}" autocomplete="off"><button type="button" class="search-clear" data-clear="${id}" title="Limpiar">&times;</button></div>`;
function wireClearButtons(root){

function mount(){
  if(!state.auth){ renderLogin(); return; }

}

  $('#app').innerHTML = `
  <div class="login">

          <label class="field"><span>Usuario</span><input id="lg-user" value="admin" autocomplete="off"></label>
          <label class="field"><span>Contraseña</span><input id="lg-pass" type="password" value="admin"></label>

    </div>
  </div>`;
  const tryLogin = ()=>{
    const u=$('#lg-user').value.trim().toLowerCase(), p=$('#lg-pass').value;
    if(!u||!p){ $('#lg-err').innerHTML='<div class="err">Ingresa usuario y contraseña.</div>'; return; }

    if(!usuario||p!=='admin'){ $('#lg-err').innerHTML='<div class="err">Usuario o contraseña incorrectos. Usa admin / admin.</div>'; return; }
    if(!usuario.activo){ $('#lg-err').innerHTML='<div class="err">Este usuario está inactivo. Contacta a un administrador.</div>'; return; }

  };
  $('#lg-btn').onclick=tryLogin;
  $('#lg-user').onkeydown=e=>{if(e.key==='Enter')$('#lg-pass').focus()};

function renderShell(){
  const user = state.usuarios.find(x=>x.id===state.currentUserId);
  const nav = navFor(user);
  if(!nav.some(n=>n.key===state.route)) state.route='dashboard';
  const navHTML = nav.map(n=>`<button data-nav="${n.key}" class="${state.route===n.key?'active':''}"><span class="ico">${n.icon}</span><span class="lbl">${n.label}</span></button>`).join('');
  const activeNav = nav.find(n=>n.key===state.route);
  $('#app').innerHTML = `

            <div class="user-menu-dropdown" id="user-menu-dropdown">

  $('#overlay').onclick=()=>{state.sidebar=false;renderShell();};

  $('#user-menu-btn').onclick=e=>{e.stopPropagation();$('#user-menu').classList.toggle('open');};
  $('#user-menu-perfil').onclick=e=>{e.preventDefault();state.perfilUserId=state.currentUserId;state.route='usuarios';state.sidebar=false;renderShell();};
  renderContent();
}

function renderContent(){
  const c=$('#content'); c.classList.add('fade');

}

function productSalesRank(){
  const cant={};
  state.notas.forEach(n=>n.items.forEach(i=>{ if(i.tipo==='flete')return; cant[i.productoId]=(cant[i.productoId]||0)+i.cantidad; }));
  const list=state.productos.filter(x=>x.tipo!=='flete').map(p=>({nombre:p.nombre,codigo:p.codigo,cantidad:cant[p.id]||0}));
  const masVendidos=[...list].sort((a,b)=>b.cantidad-a.cantidad).slice(0,5);
  const menosVendidos=[...list].sort((a,b)=>a.cantidad-b.cantidad).slice(0,5);
  return {masVendidos,menosVendidos};
}
function barChartHTML(list,color){
  if(!list.length) return '<div class="empty">Sin datos suficientes todavía.</div>';
  const max=Math.max(...list.map(x=>x.cantidad),1);
  return list.map(x=>`<div class="bar-row">
    <div class="bar-lbl"><span>${esc(x.nombre)}</span><span class="tnum muted">${x.cantidad} und</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${max?Math.round(x.cantidad/max*100):0}%;background:${color}"></div></div>
  </div>`).join('');
}
function paymentMethodStats(){
  const map={};
  state.notas.forEach(n=>{ map[n.metodo]=(map[n.metodo]||0)+n.totalUSD; });
  return METODOS_PAGO.map(m=>({metodo:m,total:map[m]||0})).sort((a,b)=>b.total-a.total);
}
function barChartMoneyHTML(list,color){
  if(!list.some(x=>x.total>0)) return '<div class="empty">Aún no hay ventas registradas por método de pago.</div>';
  const max=Math.max(...list.map(x=>x.total),1);
  return list.map(x=>`<div class="bar-row">
    <div class="bar-lbl"><span>${esc(x.metodo)}</span><span class="tnum muted">${fmtUSD(x.total)}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${max?Math.round(x.total/max*100):0}%;background:${color}"></div></div>
  </div>`).join('');
}
function renderDashboard(c){
  const p=state.productos.filter(x=>x.tipo!=='flete'), tasa=state.config.tasaBCV;

  const recientes=[...state.notas].slice(-5).reverse();
  const {masVendidos,menosVendidos}=productSalesRank();
  const metodoPago=paymentMethodStats();
  c.innerHTML=`
  <div class="stack">
    <div class="grid g4">
      <div class="stat green"><div class="l">Ventas de hoy</div><div class="v tnum">${fmtUSD(totalHoy)}</div><div class="s">${fmtBs(totalHoy*tasa)} · ${ventasHoy.length} nota(s)</div></div>
      <div class="stat"><div class="l">Valor de inventario</div><div class="v tnum">${fmtUSD(invUSD)}</div><div class="s">${fmtBs(invUSD*tasa)}</div></div>
      <div class="stat ${bajos.length?'red':'green'}"><div class="l">Productos bajo stock</div><div class="v tnum">${bajos.length}</div><div class="s">de ${p.length} productos</div></div>

    </div>
    <div class="row" style="flex-wrap:wrap;gap:16px;align-items:stretch">
      <div class="card tasa-bcv-card" style="flex:0 0 320px">
        <h3>Tasa del Día</h3>
        <div class="val tnum">${tasa.toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2})} <small>Bs</small></div>
        <div class="sub">Bolívares por dólar (BCV)</div>
      </div>
      <div class="card" style="flex:1;min-width:280px">
        <div class="card-h"><h3>Ventas por método de pago</h3></div>
        <div style="padding:18px 20px">${barChartMoneyHTML(metodoPago,'var(--navy-700)')}</div>
      </div>
    </div>
    <div class="grid g2">
      <div class="card">
        <div class="card-h"><h3>Productos más vendidos</h3></div>
        <div style="padding:18px 20px">${barChartHTML(masVendidos,'var(--green)')}</div>
      </div>
      <div class="card">
        <div class="card-h"><h3>Productos menos vendidos</h3></div>
        <div style="padding:18px 20px">${barChartHTML(menosVendidos,'var(--accent)')}</div>
      </div>
    </div>
    <div class="grid g2">
      <div class="card">
        <div class="card-h"><h3>Productos por reponer</h3><span class="badge ${bajos.length?'red':'green'}">${bajos.length} alerta(s)</span></div>
        <div style="max-height:300px;overflow-y:auto">
          ${bajos.length?bajos.map(x=>`<div style="padding:12px 20px;border-top:1px solid var(--slate-50);display:flex;justify-content:space-between;align-items:center">
            <div><div style="font-weight:600;color:var(--slate-700)">${esc(x.nombre)}</div><div class="muted" style="font-size:12px">${x.codigo} · ${x.categoria}</div></div>
            <div style="text-align:right"><span class="badge red">${x.stock} ${unidadLabel(x.unidad)}</span><div class="muted" style="font-size:11px;margin-top:2px">mín. ${x.stockMin}</div></div>
          </div>`).join(''):'<div class="empty">Todo el inventario está por encima del mínimo.</div>'}
        </div>
      </div>
      <div class="card">
        <div class="card-h"><h3>Notas de entrega recientes</h3></div>
        <div style="max-height:300px;overflow-y:auto">
          ${recientes.length?recientes.map(n=>`<div style="padding:12px 20px;border-top:1px solid var(--slate-50);display:flex;justify-content:space-between;align-items:center">
            <div><div style="font-weight:600;color:var(--slate-700)">${n.numero}</div><div class="muted" style="font-size:12px">${esc(n.clienteNombre)} · ${n.fecha}</div></div>
            ${notaTotalHTML(n)}
          </div>`).join(''):'<div class="empty">Aún no se han generado notas. Ve a Facturación para crear una.</div>'}
        </div>
      </div>
    </div>
  </div>`;
}

const unidadLabel = v => (UNIDADES.find(x=>x.v===v)||{}).l || v || 'und';
function invFiltered(){
  return state.productos.filter(p=>
    (state.invCat==='Todas'||p.categoria===state.invCat) &&
    (p.nombre.toLowerCase().includes(state.invQuery.toLowerCase())||p.codigo.toLowerCase().includes(state.invQuery.toLowerCase())));
}
function invRows(){
  const list=invFiltered();
  if(!list.length) return '<tr><td colspan="8" class="empty">No hay productos que coincidan con la búsqueda.</td></tr>';
  return list.map(p=>{
    const esFlete=p.tipo==='flete';
    const tone=esFlete?'slate':(p.stock<=p.stockMin?'red':p.stock<=p.stockMin*2?'info':'green');
    const stockCell=esFlete?'<span class="badge slate">N/A</span>':`<span class="badge ${tone}">${p.stock} ${unidadLabel(p.unidad)}</span>`;
    const costoCell=esFlete?'<span class="muted">—</span>':moneyHTML(p.costoUSD||0);
    const precioUsdCell=esFlete?'<span class="badge info">Manual</span>':`<span class="tnum" style="font-weight:600">${fmtUSD(p.precioUSD)}</span>`;
    const precioBcvCell=esFlete?'<span class="badge info">Manual</span>':`<span class="tnum" style="font-weight:600;color:var(--navy-700)">${fmtUSD(p.precioBCV)}</span>`;
    return `<tr>
      <td class="mono muted">${p.codigo}</td>
      <td style="font-weight:600;color:var(--slate-700)">${esc(p.nombre)}${esFlete?' <span class="badge navy">Flete</span>':''}</td>
      <td class="hide-sm muted">${p.categoria}</td>
      <td style="text-align:center">${stockCell}</td>
      <td class="hide-sm">${costoCell}</td>
      <td>${precioUsdCell}</td>
      <td>${precioBcvCell}</td>
      <td style="text-align:right;white-space:nowrap"><button class="iconbtn edit" title="Editar" data-edit="${p.id}">${ICON.edit}</button><button class="iconbtn danger" title="Eliminar" data-del="${p.id}">${ICON.trash}</button></td>
    </tr>`;
  }).join('');
}
function categoriaChipsHTML(){
  if(!state.categorias.length) return '<span class="muted" style="font-size:13px">Sin categorías todavía.</span>';
  return state.categorias.map(cat=>`<span class="row" style="align-items:center;gap:2px">
    <span class="badge ${cat.esFlete?'navy':'slate'}">${esc(cat.nombre)}</span>
    ${cat.esFlete?'':`<button type="button" class="cat-action" title="Editar categoría" data-cat-edit="${cat.id}">${ICON.edit}</button>
    <button type="button" class="cat-action danger" title="Eliminar categoría" data-cat-del="${cat.id}">${ICON.x}</button>`}
  </span>`).join('');
}
function renderInventario(c){
  const user=state.usuarios.find(x=>x.id===state.currentUserId);
  const puedeAjuste=puedeGestionSistema(user);
  c.innerHTML=`
  <div class="stack">
    <div class="row between" style="flex-wrap:wrap;gap:12px">
      <div class="row" style="flex:1;max-width:520px">
        ${clearableInput('inv-q','Buscar por nombre o código…',state.invQuery,320)}

      </div>

        <button type="button" class="btn btn-ghost" id="inv-cat-new" title="Nueva categoría">+ Categoría</button>

    <div class="card" style="padding:14px 20px">
      <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">

        ${categoriaChipsHTML()}
      </div>
    </div>
    ${puedeAjuste?`
    <div class="card">
      <div class="card-h"><h3>Ajuste masivo de precios</h3></div>
      <div style="padding:16px 20px">
        <div class="grid g4" style="align-items:flex-end;gap:12px">
          <label class="field"><span>Acción</span><select class="input" id="cfg-tipo"><option value="aumentar">Aumentar (+)</option><option value="disminuir">Disminuir (−)</option></select></label>
          <label class="field"><span>Porcentaje (%)</span><input class="input" id="cfg-pct" type="text" inputmode="numeric" data-numeric="int" value="10"></label>
          <label class="field"><span>Aplicar a</span><select class="input" id="cfg-cat-adj"><option>Todas</option>${state.categorias.filter(x=>!x.esFlete).map(x=>`<option>${esc(x.nombre)}</option>`).join('')}</select></label>
          <button class="btn btn-accent" id="cfg-ajuste">Aplicar ajuste</button>
        </div>
      </div>
    </div>`:''}
    <div class="card"><div class="tablewrap"><table>
      <thead><tr><th>Código</th><th>Producto</th><th class="hide-sm">Categoría</th><th style="text-align:center">Existencia</th><th class="hide-sm">Costo</th><th>Precio Efvo $</th><th>Precio Bs (BCV)</th><th></th></tr></thead>
      <tbody id="inv-tbody">${invRows()}</tbody>
    </table></div></div>
  </div>`;
  $('#inv-q').oninput=e=>{state.invQuery=e.target.value;$('#inv-tbody').innerHTML=invRows();wireInvRows();};
  $('#inv-cat').onchange=e=>{state.invCat=e.target.value;$('#inv-tbody').innerHTML=invRows();wireInvRows();};
  $('#inv-new').onclick=()=>openProducto(null);
  $('#inv-cat-new').onclick=()=>openCategoria(null);
  if(puedeAjuste){
    $('#cfg-ajuste').onclick=()=>{
      const tipo=$('#cfg-tipo').value, pct=Number($('#cfg-pct').value), cat=$('#cfg-cat-adj').value;
      if(!(pct>0&&pct<=90)){ showToast('El porcentaje debe estar entre 1 y 90.','error'); return; }
      const factor=tipo==='aumentar'?(1+pct/100):(1-pct/100);
      const afectados=state.productos.filter(p=>p.tipo!=='flete'&&(cat==='Todas'||p.categoria===cat));
      if(!afectados.length){ showToast('No hay productos que coincidan con esa categoría.','error'); return; }
      confirmModal({title:'Aplicar ajuste de precios',message:`Se ${tipo==='aumentar'?'aumentarán':'reducirán'} los precios (efectivo y Bs BCV) en ${pct}% a ${afectados.length} producto(s) de "${cat}". Esta acción no se puede deshacer.`,confirmLabel:'Aplicar',onConfirm:()=>{
        afectados.forEach(p=>{ p.precioUSD=Math.round(p.precioUSD*factor*100)/100; p.precioBCV=Math.round(p.precioBCV*factor*100)/100; });
        logActividad('Aplicó ajuste masivo de precios',tipo+' '+pct+'% · '+cat+' · '+afectados.length+' producto(s)');
        showToast(`Precios actualizados (${tipo} ${pct}%) en ${afectados.length} producto(s).`);
        renderInventario($('#content'));
      }});
    };
  }
  wireClearButtons();
  wireInvRows();
  wireCategoriaChips();
}
function wireInvRows(){
  document.querySelectorAll('#inv-tbody [data-edit]').forEach(b=>b.onclick=()=>openProducto(state.productos.find(p=>p.id===b.dataset.edit)));
  document.querySelectorAll('#inv-tbody [data-del]').forEach(b=>b.onclick=()=>{
    const prod=state.productos.find(p=>p.id===b.dataset.del); if(!prod)return;
    confirmModal({title:'Eliminar producto',message:'¿Eliminar "'+prod.nombre+'" ('+prod.codigo+')? Esta acción no se puede deshacer.',confirmLabel:'Eliminar',onConfirm:()=>{
      state.productos=state.productos.filter(x=>x.id!==prod.id);
      $('#inv-tbody').innerHTML=invRows(); wireInvRows();
      logActividad('Eliminó producto',prod.codigo+' — '+prod.nombre);
      showToast('Producto eliminado correctamente.');
    }});
  });
}
function wireCategoriaChips(){
  document.querySelectorAll('[data-cat-edit]').forEach(b=>b.onclick=()=>openCategoria(state.categorias.find(x=>x.id===b.dataset.catEdit)));
  document.querySelectorAll('[data-cat-del]').forEach(b=>b.onclick=()=>{
    const cat=state.categorias.find(x=>x.id===b.dataset.catDel); if(!cat)return;
    confirmModal({title:'Eliminar categoría',message:'¿Eliminar la categoría "'+cat.nombre+'"? Esta acción no se puede deshacer.',confirmLabel:'Eliminar',onConfirm:()=>{
      const enUso=state.productos.some(p=>p.categoria===cat.nombre && p.tipo!=='flete');
      if(enUso){ showToast('No se puede eliminar la categoría "'+cat.nombre+'" porque tiene productos asociados.','error'); return; }
      state.categorias=state.categorias.filter(x=>x.id!==cat.id);
      logActividad('Eliminó categoría',cat.nombre);
      showToast('Categoría eliminada correctamente.');
      renderInventario($('#content'));
    }});
  });
}
function openCategoria(cat){
  const f=cat||{nombre:''};
  openModal(cat?'Editar categoría':'Nueva categoría',`
    <div id="cat-err"></div>
    <label class="field"><span>Nombre de la categoría</span><input id="cat-nom" value="${esc(f.nombre)}"></label>`,()=>{
      const nom=$('#cat-nom').value.trim();
      const errs=[];
      if(!nom) errs.push('El nombre es obligatorio.');
      else if(state.categorias.some(x=>x.nombre.toLowerCase()===nom.toLowerCase()&&(!cat||x.id!==cat.id))) errs.push('Ya existe una categoría con ese nombre.');
      if(errs.length){ $('#cat-err').innerHTML=`<div class="err">${errs.map(esc).join('<br>')}</div>`; return false; }

      if(cat){ state.productos.forEach(p=>{ if(p.categoria===cat.nombre) p.categoria=nom; }); cat.nombre=nom; }
      else{ state.categorias.push({id:uid(),nombre:nom,esFlete:false}); }
      closeModal();
      logActividad(esNuevo?'Creó categoría':'Editó categoría',nom);
      showToast(esNuevo?'Categoría creada correctamente.':'Categoría actualizada correctamente.');
      renderInventario($('#content'));
    });
}

      <label class="field"><span>Costo (USD)</span><input id="m-cos" type="text" inputmode="decimal" data-numeric="decimal" value="${esFlete?0:(f.costoUSD||'')}" ${esFlete?'disabled':''}></label>
      <div></div>
      <label class="field"><span>Precio efectivo (USD)</span><input id="m-pre" type="text" inputmode="decimal" data-numeric="decimal" value="${esFlete?0:f.precioUSD}" ${esFlete?'disabled':''}></label>
      <label class="field"><span>Precio Bs (equiv. BCV, USD)</span><input id="m-pre-bcv" type="text" inputmode="decimal" data-numeric="decimal" value="${esFlete?0:(f.precioBCV||'')}" ${esFlete?'disabled':''}></label>

    </div>`,()=>{
      const cod=$('#m-cod').value.trim(),nom=$('#m-nom').value.trim();
      const tipo=$('#m-tipo').value;
      const errs=[];
      if(!cod) errs.push('El código es obligatorio.');
      else if(state.productos.some(x=>x.codigo.toLowerCase()===cod.toLowerCase()&&(!p||x.id!==p.id))) errs.push('Ya existe un producto con ese código.');
      if(!nom) errs.push('El nombre es obligatorio.');
      let cat='',unidad='und',stock=0,stockMin=0,costo=0,precioUsd=0,precioBcv=0;
      if(tipo!=='flete'){
        cat=$('#m-cat').value; unidad=$('#m-und').value;
        stock=Number($('#m-stk').value); stockMin=Number($('#m-min').value);
        costo=Number($('#m-cos').value); precioUsd=Number($('#m-pre').value); precioBcv=Number($('#m-pre-bcv').value);
        if(!cat) errs.push('Selecciona una categoría.');
        if(!(stock>0)) errs.push('La existencia no puede quedar vacía ni ser 0.');

      const data=tipo==='flete'

        :{codigo:cod,nombre:nom,categoria:cat,tipo,unidad,stock,stockMin,costoUSD:costo,precioUSD:precioUsd,precioBCV:precioBcv};
      const esNuevo=!p;
      if(p){Object.assign(p,data);}else{state.productos.push({id:uid(),...data});}
      closeModal();$('#inv-tbody').innerHTML=invRows();wireInvRows();

    const isF=tipoSel.value==='flete';
    ['#m-stk','#m-min','#m-cos','#m-pre','#m-pre-bcv'].forEach(sel=>{$(sel).disabled=isF;if(isF)$(sel).value=0;});
    $('#m-cat').disabled=isF; $('#m-und').disabled=isF;
    $('#m-flete-note').style.display=isF?'':'none';
  };
  tipoSel.onchange=toggleFlete;

function facResults(){
  const q=state.facQuery.trim().toLowerCase();
  if(!q) return '';
  const list=state.productos.filter(p=>p.nombre.toLowerCase().includes(q)||p.codigo.toLowerCase().includes(q)).slice(0,8);
  if(!list.length) return '<div class="results"><div class="empty" style="padding:16px">Sin coincidencias.</div></div>';
  return `<div class="results">${list.map(p=>{
    const esFlete=p.tipo==='flete';
    const disabled=!esFlete&&p.stock<=0;
    const rightInfo=esFlete?'<span class="badge amber">Precio manual</span>':`<div style="font-weight:600" class="tnum">${fmtUSD(p.precioUSD)} <span class="muted" style="font-weight:400">efvo</span></div><div class="muted tnum" style="font-size:11px">${fmtUSD(p.precioBCV)} Bs BCV</div><span class="badge ${p.stock<=p.stockMin?'red':'green'}">Stock: ${p.stock}</span>`;
    return `<button data-add="${p.id}" ${disabled?'disabled':''}>
      <div><div style="font-weight:600;color:var(--slate-700)">${esc(p.nombre)}</div><div class="muted mono">${p.codigo}</div></div>
      <div style="text-align:right">${rightInfo}</div>
    </button>`;
  }).join('')}</div>`;
}
function facEsDivisa(){ return state.facMoneda!=='BS'; }
function facLineaTotalHTML(montoUSDequiv){
  const tasa=state.config.tasaBCV;
  return facEsDivisa()
    ?`<div class="money"><div class="u tnum">${fmtUSD(montoUSDequiv)}</div></div>`
    :`<div class="money"><div class="u tnum">${fmtBs(montoUSDequiv*tasa)}</div></div>`;
}
function facCartRows(){
  if(!state.cart.length) return '<tr><td colspan="6" class="empty">Busca y agrega productos para iniciar la nota de entrega.</td></tr>';
  const esDivisa=facEsDivisa();
  return state.cart.map(i=>{
    const esFlete=i.tipo==='flete';
    const precioActivo=esDivisa?i.precioUSD:i.precioBCV;
    const lt=precioActivo*i.cantidad;
    const dispInfo=esFlete?'flete · precio único':`disp. ${i.stockDisp}`;
    const cantCell=esFlete?'<span class="muted">—</span>':`<input class="qty tnum" type="number" min="1" max="${i.stockDisp}" value="${i.cantidad}" data-qty="${i.cartId}">`;
    return `<tr${esFlete?' style="background:rgba(245,158,11,.06)"':''}>
      <td><div style="font-weight:600;color:var(--slate-700)">${esc(i.nombre)}</div><div class="muted tnum" style="font-size:12px"><span class="mono">${i.codigo}</span> · ${dispInfo}</div></td>
      <td style="text-align:center"><input class="qty tnum" type="number" min="0" step="0.01" value="${i.precioUSD}" data-price-usd="${i.cartId}" style="width:76px"></td>
      <td style="text-align:center"><input class="qty tnum" type="number" min="0" step="0.01" value="${i.precioBCV}" data-price-bcv="${i.cartId}" style="width:76px"></td>
      <td style="text-align:center">${cantCell}</td>
      <td data-tot="${i.cartId}">${facLineaTotalHTML(lt)}</td>
      <td style="text-align:center"><button class="iconbtn danger" title="Quitar" data-rm="${i.cartId}">${ICON.x}</button></td>
    </tr>`;
  }).join('');
}
function facSummary(){
  const esDivisa=facEsDivisa();
  const sub=state.cart.reduce((s,i)=>s+(esDivisa?i.precioUSD:i.precioBCV)*i.cantidad,0);
  const dgAplica=state.facMetodo==='Efectivo (USD)';
  const dg=dgAplica?(Number(state.facDescGlobal)||0):0;
  const tot=sub*(1-dg/100);
  const tasa=state.config.tasaBCV;
  const fmt=esDivisa?fmtUSD:(n=>fmtBs(n*tasa));
  const monedaLbl=esDivisa?'Divisas (USD efectivo)':'Bolívares (BCV)';
  let action;
  if(!state.facPagoRegistrado){
    action=`<button class="btn btn-accent" id="fac-pay" style="width:100%;margin-top:14px;padding:13px">Registrar pago</button>
      <p style="text-align:center;font-size:11px;color:rgba(203,217,234,.5);margin-top:8px">Selecciona el método de pago y regístralo para poder facturar</p>`;
  }else{
    action=`<div style="background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.45);border-radius:8px;padding:10px 12px;margin-top:14px;font-size:13px;color:#6ee7b7;display:flex;align-items:center;gap:8px">
        <span style="width:16px;height:16px;color:#6ee7b7">${ICON.x.replace('M18 6 6 18M6 6l12 12','M20 6 9 17l-5-5')}</span>
        Pago registrado · ${esc(state.facMetodo)}${state.facRef?(' · '+esc(state.facRef)):''}</div>
      <button class="btn btn-accent" id="fac-bill" style="width:100%;margin-top:10px;padding:13px">Facturar · generar nota</button>
      <p style="text-align:center;font-size:11px;color:rgba(203,217,234,.5);margin-top:8px">Nota de entrega en ${monedaLbl.toLowerCase()} · descarga automática</p>`;
  }
  return `
    <div class="line"><span>Moneda de la venta</span><span class="tnum">${monedaLbl}</span></div>
    <div class="line"><span>Subtotal</span><span class="tnum">${fmt(sub)}</span></div>
    ${dg>0?`<div class="line acc"><span>Desc. global (${dg}%)</span><span class="tnum">- ${fmt(sub-tot)}</span></div>`:''}
    <div class="tot"><div style="display:flex;justify-content:space-between;align-items:flex-end"><span style="color:rgba(203,217,234,.85)">Total</span><span class="big tnum">${fmt(tot)}</span></div></div>
    ${action}`;
}
function renderFacturacion(c){
  c.innerHTML=`
  <div class="grid g3">
    <div class="stack">
      <div class="card" style="padding:16px;position:relative">
        <label class="field"><span>Buscar producto para facturar</span>${clearableInput('fac-q','Escribe nombre o código…',state.facQuery)}</label>

      <div class="card"><div class="tablewrap"><table>

      </table></div></div>
    </div>
    <div class="stack">
      <div class="card" style="padding:20px">

            <select class="input" id="fac-cli-tipo" style="max-width:68px">${DOC_TIPOS.map(t=>`<option ${state.facCliDocTipo===t?'selected':''}>${t}</option>`).join('')}</select>
            <input class="input" id="fac-cli-doc" placeholder="12345678" value="${esc(state.facCliDocQuery)}" autocomplete="off">
            <button class="btn btn-primary" id="fac-cli-buscar" style="white-space:nowrap">Buscar</button>
          </div>
        </label>

        <label class="field"><span>Método de pago</span>
          <select class="input" id="fac-met"><option value="">Seleccione…</option>${METODOS_PAGO.map(m=>`<option ${state.facMetodo===m?'selected':''}>${m}</option>`).join('')}</select>
        </label>
        <label class="field" style="margin-top:14px"><span>Moneda de facturación</span>
          <select class="input" id="fac-moneda">
            <option value="USD" ${state.facMoneda==='USD'?'selected':''}>Divisas (efectivo USD)</option>
            <option value="BS" ${state.facMoneda==='BS'?'selected':''}>Bolívares (Bs, al cambio BCV)</option>
          </select>
        </label>
        <div class="muted" style="font-size:11px;margin-top:6px">Se sugiere automáticamente según el método de pago, pero puedes cambiarla manualmente.</div>
        <label class="field" style="margin-top:14px"><span>Referencia / Nº de pago (opcional)</span><input class="input" id="fac-ref" value="${esc(state.facRef)}" placeholder="Ej: 004512"></label>
        <label class="field" style="margin-top:14px"><span>Descuento global (%) <span class="muted" style="font-weight:400">(solo Efectivo USD)</span></span><input class="input" id="fac-dg" type="number" min="0" max="100" value="${state.facDescGlobal}" ${state.facMetodo==='Efectivo (USD)'?'':'disabled'}></label>

function updateCliInfo(){
  const cl=state.clientes.find(c=>c.id===state.facCliente);
  $('#fac-cli-info').innerHTML=cl
    ?`<b style="color:var(--slate-700)">${esc(cl.nombre)}</b> · ${esc(cl.doc)} · ${esc(cl.telefono||'—')}`
    :'Ingresa la cédula/RIF y presiona Buscar para cargar o registrar al cliente.';
}
function facBuscarClientePorDoc(){
  const tipo=$('#fac-cli-tipo').value;
  const numero=$('#fac-cli-doc').value.trim();
  state.facCliDocTipo=tipo; state.facCliDocQuery=numero;
  if(!numero){showToast('Ingresa el número de cédula o RIF del cliente.','error');return;}
  const doc=tipo+'-'+numero;
  const found=state.clientes.find(cl=>cl.doc.trim().toLowerCase()===doc.toLowerCase());
  if(found){
    state.facCliente=found.id; state.facPagoRegistrado=false;
    updateCliInfo(); refreshSummary();
  }else{
    openCliente(null,doc,(nuevo)=>{
      state.facCliente=nuevo.id; state.facPagoRegistrado=false;
      const parts=splitDoc(nuevo.doc); state.facCliDocTipo=parts.tipo; state.facCliDocQuery=parts.numero;
      const inp=$('#fac-cli-doc'); if(inp)inp.value=parts.numero;
      const sel=$('#fac-cli-tipo'); if(sel)sel.value=parts.tipo;
      updateCliInfo(); refreshSummary();
    });
  }
}
function refreshCartAndSummary(){
  const th=$('#fac-th-total'); if(th)th.textContent='Total ('+(facEsDivisa()?'$':'Bs')+')';
  const cart=$('#fac-cart'); if(cart){cart.innerHTML=facCartRows();wireFacCart();}
  const dg=$('#fac-dg'); if(dg)dg.disabled=state.facMetodo!=='Efectivo (USD)';
  refreshSummary();
}
function refreshSummary(){ $('#fac-summary').innerHTML=facSummary(); const pay=$('#fac-pay'); if(pay)pay.onclick=registrarPago; const bill=$('#fac-bill'); if(bill)bill.onclick=facturar; }
function wireFac(){
  updateCliInfo();
  const q=$('#fac-q');
  q.oninput=e=>{state.facQuery=e.target.value;$('#fac-results').innerHTML=facResults();wireFacResults();};
  wireFacResults();
  wireClearButtons();
  $('#fac-cli-tipo').onchange=e=>{state.facCliDocTipo=e.target.value;};
  $('#fac-cli-doc').oninput=e=>{state.facCliDocQuery=e.target.value;};
  $('#fac-cli-doc').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();facBuscarClientePorDoc();}};
  $('#fac-cli-buscar').onclick=facBuscarClientePorDoc;
  $('#fac-met').onchange=e=>{
    state.facMetodo=e.target.value; state.facPagoRegistrado=false;
    if(state.facMetodo!=='Efectivo (USD)') state.facDescGlobal=0;
    if(state.facMetodo){ state.facMoneda=esMetodoDivisa(state.facMetodo)?'USD':'BS'; const sel=$('#fac-moneda'); if(sel)sel.value=state.facMoneda; }
    const dg=$('#fac-dg'); if(dg)dg.value=state.facDescGlobal;
    refreshCartAndSummary();
  };
  $('#fac-moneda').onchange=e=>{ state.facMoneda=e.target.value; state.facPagoRegistrado=false; refreshCartAndSummary(); };
  $('#fac-ref').oninput=e=>{state.facRef=e.target.value;state.facPagoRegistrado=false;refreshSummary();};
  $('#fac-dg').oninput=e=>{state.facDescGlobal=e.target.value;state.facPagoRegistrado=false;refreshSummary();};
  wireFacCart();
  refreshSummary();
}
function wireFacResults(){
  document.querySelectorAll('#fac-results [data-add]').forEach(b=>b.onclick=()=>{
    const p=state.productos.find(x=>x.id===b.dataset.add); if(!p)return;
    if(p.tipo==='flete'){
      state.cart.push({productoId:p.id,cartId:uid(),codigo:p.codigo,nombre:p.nombre,tipo:'flete',precioUSD:0,precioBCV:0,costoUSD:0,cantidad:1,stockDisp:null});
    }else{
      if(p.stock<=0)return;
      const ex=state.cart.find(i=>i.productoId===p.id&&i.tipo!=='flete');
      if(ex){ if(ex.cantidad<p.stock) ex.cantidad++; }
      else state.cart.push({productoId:p.id,cartId:uid(),codigo:p.codigo,nombre:p.nombre,tipo:'normal',precioUSD:p.precioUSD,precioBCV:p.precioBCV,costoUSD:p.costoUSD||0,cantidad:1,stockDisp:p.stock});
    }
    state.facQuery=''; $('#fac-q').value=''; $('#fac-results').innerHTML=''; state.facPagoRegistrado=false;
    $('#fac-cart').innerHTML=facCartRows(); wireFacCart(); refreshSummary();
  });
}
function wireFacCart(){
  const esDivisa=facEsDivisa();
  document.querySelectorAll('#fac-cart [data-price-usd]').forEach(inp=>inp.oninput=()=>{
    const i=state.cart.find(x=>x.cartId===inp.dataset.priceUsd); if(!i)return;
    i.precioUSD=Math.max(0,Number(inp.value)||0); state.facPagoRegistrado=false;
    if(esDivisa){ document.querySelector(`[data-tot="${i.cartId}"]`).innerHTML=facLineaTotalHTML(i.precioUSD*i.cantidad); refreshSummary(); }
  });
  document.querySelectorAll('#fac-cart [data-price-bcv]').forEach(inp=>inp.oninput=()=>{
    const i=state.cart.find(x=>x.cartId===inp.dataset.priceBcv); if(!i)return;
    i.precioBCV=Math.max(0,Number(inp.value)||0); state.facPagoRegistrado=false;
    if(!esDivisa){ document.querySelector(`[data-tot="${i.cartId}"]`).innerHTML=facLineaTotalHTML(i.precioBCV*i.cantidad); refreshSummary(); }
  });
  document.querySelectorAll('#fac-cart [data-qty]').forEach(inp=>inp.oninput=()=>{
    const i=state.cart.find(x=>x.cartId===inp.dataset.qty); if(!i)return;
    let v=Number(inp.value)||1; v=i.tipo==='flete'?Math.max(1,v):Math.max(1,Math.min(v,i.stockDisp)); i.cantidad=v;
    state.facPagoRegistrado=false;
    const precioActivo=esDivisa?i.precioUSD:i.precioBCV;
    document.querySelector(`[data-tot="${i.cartId}"]`).innerHTML=facLineaTotalHTML(precioActivo*i.cantidad); refreshSummary();
  });
  document.querySelectorAll('#fac-cart [data-rm]').forEach(b=>b.onclick=()=>{
    state.cart=state.cart.filter(i=>i.cartId!==b.dataset.rm); state.facPagoRegistrado=false;

  });
}
function registrarPago(){
  if(!state.cart.length){showToast('Agrega al menos un producto antes de registrar el pago.','error');return;}
  if(!state.facCliente){showToast('Busca o registra al cliente por su cédula/RIF.','error');return;}
  if(!state.facMetodo){showToast('Selecciona el método de pago.','error');return;}
  const esDivisa=facEsDivisa();
  const sinPrecio=state.cart.find(i=>i.tipo==='flete'&&(esDivisa?(!i.precioUSD||i.precioUSD<=0):(!i.precioBCV||i.precioBCV<=0)));
  if(sinPrecio){showToast('Debes ingresar manualmente el precio ('+(esDivisa?'efectivo USD':'Bs BCV')+') del flete "'+sinPrecio.nombre+'" antes de continuar.','error');return;}
  state.facPagoRegistrado=true; refreshSummary();
  showToast('Pago registrado. Ya puedes facturar la venta.');
}
function facturar(){
  if(!state.facPagoRegistrado){showToast('Primero registra el pago.','error');return;}
  const cl=state.clientes.find(c=>c.id===state.facCliente);
  if(!cl){showToast('Busca o registra al cliente por su cédula/RIF.','error');return;}
  const esDivisa=facEsDivisa();
  const sub=state.cart.reduce((s,i)=>s+(esDivisa?i.precioUSD:i.precioBCV)*i.cantidad,0);
  const dg=state.facMetodo==='Efectivo (USD)'?(Number(state.facDescGlobal)||0):0;
  const totalUSD=sub*(1-dg/100);
  const numero='NE-'+String(state.notas.length+1).padStart(5,'0');
  const cajero=state.usuarios.find(u=>u.id===state.currentUserId);
  const nota={id:uid(),numero,fecha:todayStr(),ts:Date.now(),clienteId:cl.id,clienteNombre:cl.nombre,items:state.cart.map(i=>({...i})),descGlobal:dg,subtotalUSD:sub,tasa:state.config.tasaBCV,totalUSD,metodo:state.facMetodo,referencia:state.facRef,moneda:esDivisa?'USD':'BS',cajeroId:cajero?cajero.id:'',cajeroNombre:cajero?cajero.nombre:''};
  state.cart.forEach(i=>{if(i.tipo==='flete')return;const p=state.productos.find(x=>x.id===i.productoId);if(p&&p.stock!=null)p.stock-=i.cantidad;});
  state.notas.push(nota);
  generarNotaPDF(nota,cl);
  logActividad('Generó venta',nota.numero+' — '+cl.nombre+' · '+(esDivisa?fmtUSD(totalUSD):fmtBs(totalUSD*nota.tasa)));
  showToast('Nota '+nota.numero+' generada correctamente.');
  state.cart=[]; state.facCliente=''; state.facCliDocTipo='V'; state.facCliDocQuery=''; state.facDescGlobal=0; state.facQuery=''; state.facMetodo=''; state.facMoneda='USD'; state.facRef=''; state.facPagoRegistrado=false;
  renderFacturacion($('#content'));
}

const REP_PERIODOS = [{v:'dia',l:'Diario'},{v:'semana',l:'Semanal'},{v:'mes',l:'Mensual'}];
function repRango(periodo){
  const now=new Date();
  if(periodo==='dia'){ const s=new Date(now); s.setHours(0,0,0,0); const e=new Date(s); e.setHours(23,59,59,999); return {start:s,end:e}; }
  if(periodo==='semana'){ const day=(now.getDay()+6)%7; const s=new Date(now); s.setDate(s.getDate()-day); s.setHours(0,0,0,0); const e=new Date(s); e.setDate(s.getDate()+6); e.setHours(23,59,59,999); return {start:s,end:e}; }
  const s=new Date(now.getFullYear(),now.getMonth(),1,0,0,0,0); const e=new Date(now.getFullYear(),now.getMonth()+1,0,23,59,59,999); return {start:s,end:e};
}
function repActiveRango(){
  if(state.repDesde&&state.repHasta){
    const s=new Date(state.repDesde+'T00:00:00'); const e=new Date(state.repHasta+'T23:59:59');
    return {start:s,end:e,label:'Personalizado',custom:true};
  }
  const {start,end}=repRango(state.repPeriodo);
  return {start,end,label:REP_PERIODOS.find(p=>p.v===state.repPeriodo).l,custom:false};
}
function repItemsFiltro(i){ return !state.repProducto||i.productoId===state.repProducto; }
const notaPrecioItem = (n,i) => n.moneda==='BS' ? i.precioBCV : i.precioUSD;
function repFiltrarNotas(rango){
  return state.notas.filter(n=>{
    if(n.ts<rango.start.getTime()||n.ts>rango.end.getTime())return false;
    if(state.repMetodo&&n.metodo!==state.repMetodo)return false;
    if(state.repProducto&&!n.items.some(i=>i.productoId===state.repProducto))return false;
    return true;
  });
}
function repStats(rango){
  const notas=repFiltrarNotas(rango);
  let ventasTotal=0, ventasFlete=0, costoTotal=0, itemsFlete=0;
  notas.forEach(n=>{
    const factor=n.subtotalUSD>0?n.totalUSD/n.subtotalUSD:1;
    n.items.filter(repItemsFiltro).forEach(i=>{
      const itemFinal=notaPrecioItem(n,i)*i.cantidad*factor;
      const itemCosto=(i.costoUSD||0)*i.cantidad;
      ventasTotal+=itemFinal; costoTotal+=itemCosto;
      if(i.tipo==='flete'){ ventasFlete+=itemFinal; itemsFlete++; }
    });
  });
  return {notas,ventasTotal,ventasFlete,costoTotal,utilidad:ventasTotal-costoTotal,itemsFlete};
}
function repProductStats(rango){
  const notas=repFiltrarNotas(rango);
  const map={};
  notas.forEach(n=>{
    const factor=n.subtotalUSD>0?n.totalUSD/n.subtotalUSD:1;
    n.items.filter(repItemsFiltro).forEach(i=>{
      const key=i.productoId;
      const itemFinal=notaPrecioItem(n,i)*i.cantidad*factor;
      const itemCosto=(i.costoUSD||0)*i.cantidad;
      if(!map[key]) map[key]={codigo:i.codigo,nombre:i.nombre,cantidad:0,ventas:0,costo:0};
      map[key].cantidad+=i.cantidad; map[key].ventas+=itemFinal; map[key].costo+=itemCosto;
    });
  });
  return Object.values(map).map(x=>({...x,utilidad:x.ventas-x.costo})).sort((a,b)=>b.utilidad-a.utilidad);
}
function repNotaMontoFiltrado(n){
  const factor=n.subtotalUSD>0?n.totalUSD/n.subtotalUSD:1;
  return n.items.filter(repItemsFiltro).reduce((s,i)=>s+notaPrecioItem(n,i)*i.cantidad*factor,0);
}

function cierreRangoDia(fechaISO){
  const [y,m,d]=fechaISO.split('-').map(Number);
  const start=new Date(y,m-1,d,0,0,0,0);
  const end=new Date(y,m-1,d,23,59,59,999);
  return {start,end};
}
function fmtDateTime(ts){ return new Date(ts).toLocaleString('es-VE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function agregarNotas(notas){
  const divisas={notas:[],porMetodo:{},total:0,fleteTotal:0,fleteCount:0};
  const bs={notas:[],porMetodo:{},total:0,fleteTotal:0,fleteCount:0};
  let costoTotal=0, ventasTotal=0;
  notas.forEach(n=>{
    const grupo=n.moneda==='BS'?bs:divisas;
    grupo.notas.push(n);
    grupo.porMetodo[n.metodo]=(grupo.porMetodo[n.metodo]||0)+n.totalUSD;
    grupo.total+=n.totalUSD;
    const factor=n.subtotalUSD>0?n.totalUSD/n.subtotalUSD:1;
    n.items.forEach(i=>{
      const itemFinal=notaPrecioItem(n,i)*i.cantidad*factor;
      const itemCosto=(i.costoUSD||0)*i.cantidad;
      costoTotal+=itemCosto; ventasTotal+=itemFinal;
      if(i.tipo==='flete'){ grupo.fleteTotal+=itemFinal; grupo.fleteCount++; }
    });
  });
  return {notas,divisas,bs,costoTotal,ventasTotal,utilidad:ventasTotal-costoTotal};
}

  y+=28;
  doc.setFontSize(12); doc.text('BOLÍVARES (Bs, al cambio BCV)',40,y);
  const bodyBs=Object.entries(s.bs.porMetodo).map(([m,v])=>[m,String(s.bs.notas.filter(n=>n.metodo===m).length),fmtBs(v*tasa)]);
  doc.autoTable({startY:y+8,head:[['Método','N° ventas','Total Bs']],body:bodyBs.length?bodyBs:[['Sin ventas','—','—']],theme:'striped',
    headStyles:{fillColor:navy,textColor:255,fontSize:8},bodyStyles:{fontSize:8,textColor:50},
    columnStyles:{1:{halign:'center'},2:{halign:'right'}},margin:{left:40,right:40}});

  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('Total Bs: '+fmtBs(s.bs.total*tasa)+'  ('+s.bs.notas.length+' venta(s), incl. '+s.bs.fleteCount+' flete(s) por '+fmtBs(s.bs.fleteTotal*tasa)+')',40,y);

  y+=28;
  doc.setDrawColor(...navy); doc.setLineWidth(1.2); doc.line(40,y-14,W-40,y-14);
  doc.setFontSize(11);
  doc.text('Ventas totales del día (equiv. USD): '+fmtUSD(s.ventasTotal),40,y);
  doc.text('Costo de mercancía vendida: '+fmtUSD(s.costoTotal),40,y+16);
  doc.text('Utilidad del día: '+fmtUSD(s.utilidad)+' ('+fmtBs(s.utilidad*tasa)+')',40,y+32);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(140,140,140);
  doc.text('Tasa BCV aplicada: '+fmtBs(tasa)+' / $ · '+s.notas.length+' nota(s) en total',40,y+50);
  doc.save(filename+'.pdf');
  logActividad(titulo==='CIERRE GENERAL'?'Descargó cierre general':'Descargó cierre de caja',fechaTxt);
  showToast('Cierre descargado correctamente.');
}

/* ---------------- Mi cierre de caja (por turno de cajero) ---------------- */
function miCierrePendiente(userId){
  const propios=state.cierres.filter(c=>c.cajeroId===userId);
  const ultimo=propios.length?propios.reduce((a,b)=>a.hasta>b.hasta?a:b):null;
  const desde=ultimo?ultimo.hasta:null;
  const notas=state.notas.filter(n=>n.cajeroId===userId && (desde===null||n.ts>desde));
  return {desde,stats:agregarNotas(notas)};
}

function fechaEfectivaBCV(d){
  d=d||new Date();
  const day=d.getDay();
  if(day===0||day===6){
    const lunes=new Date(d);
    lunes.setDate(lunes.getDate()+(day===0?1:2));
    return toISODate(lunes);
  }
  return toISODate(d);
}
function tasaHoyRegistrada(){
  const eff=fechaEfectivaBCV();
  return state.tasas.find(t=>t.fecha===eff);
}
function extraerTasaJSON(obj,depth){
  depth=depth||0; if(depth>6||obj==null) return null;
  if(typeof obj==='number') return obj>0?obj:null;
  if(typeof obj==='object'){
    for(const k of ['promedio','price','precio','rate','valor']){
      if(k in obj){ const v=Number(obj[k]); if(v>0) return v; }
    }
    for(const k in obj){ const r=extraerTasaJSON(obj[k],depth+1); if(r) return r; }
  }
  return null;
}
async function actualizarTasaBCV(){
  const eff=fechaEfectivaBCV();
  if(state.tasas.find(t=>t.fecha===eff)){ showToast('Ya hay una tasa registrada para hoy.','error'); return; }
  const btn=$('#cfg-tasa-refresh');
  if(btn){ btn.disabled=true; btn.textContent='Actualizando…'; }
  let tasa=null;
  try{
    const r=await fetch('https://pydolarve.org/api/v1/dollar?page=bcv&monitor=usd');
    if(r.ok) tasa=extraerTasaJSON(await r.json());
  }catch(e){}
  if(!tasa){
    try{
      const r2=await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
      if(r2.ok) tasa=extraerTasaJSON(await r2.json());
    }catch(e){}
  }
  let simulado=false;
  if(!(tasa>0)){
    tasa=Math.round((state.config.tasaBCV+(0.3+Math.random()*1.2))*100)/100;
    simulado=true;
  }
  state.tasas.push({fecha:eff,tasa,origen:'AUTO'});
  const anterior=state.config.tasaBCV;
  state.config.tasaBCV=tasa;
  logActividad('Actualizó tasa BCV',fmtBs(anterior)+' → '+fmtBs(tasa)+(simulado?' (simulada, sin conexión)':' (BCV)'));
  showToast(simulado?'No se pudo contactar al BCV; se generó una tasa simulada para la demo.':'Tasa BCV actualizada correctamente desde la fuente oficial.',simulado?'info':undefined);
  renderShell();
}

/*  Modal                                                           */
/* ================================================================ */
function openModal(title,bodyHTML,onSave){
  $('#modal-root').innerHTML=`
  <div class="modal-bg" id="modal-bg">
    <div class="modal" id="modal-card">
      <div class="modal-h"><h3>${title}</h3><button class="modal-x" id="modal-x">&times;</button></div>
      <div class="modal-b">${bodyHTML}
        <div class="modal-foot"><button class="btn btn-ghost" id="modal-cancel">Cancelar</button><button class="btn btn-primary" id="modal-save">Guardar</button></div>
      </div>
    </div>
  </div>`;
  $('#modal-x').onclick=closeModal; $('#modal-cancel').onclick=closeModal;
  $('#modal-save').onclick=()=>{onSave();};
}
function closeModal(){ $('#modal-root').innerHTML=''; }

/* ================================================================ */
/*  Toasts (confirmaciones no intrusivas)                           */
/* ================================================================ */
function showToast(message,type){
  const root=$('#toast-root'); if(!root)return;
  const id=uid();
  const div=document.createElement('div');
  div.className='toast'+(type&&type!=='success'?' '+type:'');
  div.id='toast-'+id;
  const icon=type==='error'?'✕':type==='info'?'ℹ':'✓';
  div.innerHTML=`<span style="font-size:15px">${icon}</span><span>${esc(message)}</span>`;
  root.appendChild(div);
  setTimeout(()=>{ const el=$('#toast-'+id); if(el)el.remove(); },3200);
}

/* ================================================================ */
/*  Confirmación personalizada (reemplaza confirm() nativo)         */
/* ================================================================ */
function confirmModal(opts){
  const {title='¿Confirmar acción?',message='',confirmLabel='Eliminar',onConfirm}=opts;
  $('#confirm-root').innerHTML=`
  <div class="modal-bg" id="cf-bg">
    <div class="confirm-modal">
      <h3>${esc(title)}</h3>
      <p>${esc(message)}</p>
      <div class="foot"><button class="btn btn-ghost" id="cf-cancel">Cancelar</button><button class="btn btn-danger" id="cf-ok">${esc(confirmLabel)}</button></div>
    </div>
  </div>`;
  const close=()=>{ $('#confirm-root').innerHTML=''; };
  $('#cf-cancel').onclick=close;
  $('#cf-ok').onclick=()=>{ close(); onConfirm(); };
}

/* ================================================================ */
/*  Registro de actividad por usuario                               */
/* ================================================================ */
function currentUserNombre(){
  const u=state.usuarios.find(x=>x.id===state.currentUserId);
  return u?u.nombre:'Sistema';
}
function logActividad(accion,detalle){
  state.actividad.push({id:uid(),ts:Date.now(),usuarioId:state.currentUserId,usuario:currentUserNombre(),accion,detalle:detalle||''});
}

/* ================================================================ */
/*  Mecánica global: cerrar dropdown de usuario al hacer click fuera, */
/*  y sanitizar inputs marcados data-numeric="int"|"decimal"        */
/* ================================================================ */
document.addEventListener('click',e=>{
  const menu=$('#user-menu');
  if(menu && !menu.contains(e.target)) menu.classList.remove('open');
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(!el.matches || !el.matches('[data-numeric]')) return;
  const val=el.value;
  let cleaned;
  if(el.dataset.numeric==='decimal'){
    cleaned=val.replace(/[^0-9.]/g,'');
    const parts=cleaned.split('.');
    if(parts.length>2) cleaned=parts[0]+'.'+parts.slice(1).join('');
  }else{
    cleaned=val.replace(/[^0-9]/g,'');
  }
  if(cleaned!==val) el.value=cleaned;
});

/* ================================================================ */
/*  Init                                                            */
/* ================================================================ */
mount();
</script>
